[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2cad"
version = "0.1.0"
description = "Convert black-and-white scanned PDF drawings into CAD-friendly DXF geometry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.3.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
scan2cad = "scan2cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
